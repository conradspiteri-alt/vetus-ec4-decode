<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1180" height="700" fill="#ffffff"/>
  <text x="590" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#111">EC4 bus - as wired, and the CANT tap</text>
  <text x="590" y="53" text-anchor="middle" font-size="12.5" fill="#555">2 controls (EC4H2) daisy-chained between the two actuator boxes (EC4UMM1). The boxes are the bus ends and carry the terminators.</text>

  <!-- ===================== ROW A: the test boat as wired ===================== -->
  <text x="40" y="100" font-size="14" font-weight="700" fill="#222">A. As wired today (2 control / 2 box)</text>

  <line x1="150" y1="150" x2="1030" y2="150" stroke="#333" stroke-width="2.5"/>
  <line x1="150" y1="162" x2="1030" y2="162" stroke="#777" stroke-width="2"/>
  <text x="120" y="152" text-anchor="end" font-size="10" fill="#333">H</text>
  <text x="120" y="168" text-anchor="end" font-size="10" fill="#777">L</text>

  <!-- ends: boxes with terminators -->
  <rect x="150" y="188" width="160" height="60" rx="6" fill="#fdecea" stroke="#a5372a" stroke-width="2"/>
  <text x="230" y="210" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7a2418">PORT box</text>
  <text x="230" y="227" text-anchor="middle" font-size="9.5" fill="#7a3020">EC4UMM1 · END</text>
  <text x="230" y="241" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c0392b">JP19 term ON</text>
  <line x1="230" y1="162" x2="230" y2="188" stroke="#888" stroke-width="1.5"/>

  <rect x="430" y="188" width="160" height="60" rx="6" fill="#eef4fb" stroke="#1565c0"/>
  <text x="510" y="210" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0d47a1">Control: flybridge</text>
  <text x="510" y="227" text-anchor="middle" font-size="9.5" fill="#345">EC4H2 · MID</text>
  <text x="510" y="241" text-anchor="middle" font-size="9.5" fill="#345">term OFF</text>
  <line x1="510" y1="162" x2="510" y2="188" stroke="#888" stroke-width="1.5"/>

  <rect x="620" y="188" width="160" height="60" rx="6" fill="#eef4fb" stroke="#1565c0"/>
  <text x="700" y="210" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0d47a1">Control: main helm</text>
  <text x="700" y="227" text-anchor="middle" font-size="9.5" fill="#345">EC4H2 · MID</text>
  <text x="700" y="241" text-anchor="middle" font-size="9.5" fill="#345">term OFF</text>
  <line x1="700" y1="162" x2="700" y2="188" stroke="#888" stroke-width="1.5"/>

  <rect x="870" y="188" width="160" height="60" rx="6" fill="#fdecea" stroke="#a5372a" stroke-width="2"/>
  <text x="950" y="210" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7a2418">STBD box</text>
  <text x="950" y="227" text-anchor="middle" font-size="9.5" fill="#7a3020">EC4UMM1 · END</text>
  <text x="950" y="241" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c0392b">JP19 term ON</text>
  <line x1="950" y1="162" x2="950" y2="188" stroke="#888" stroke-width="1.5"/>

  <text x="590" y="286" text-anchor="middle" font-size="11" fill="#555">Three interior DTCAN segments (box-control, control-control, control-box). Any one is a valid mid-chain tap point.</text>

  <!-- ===================== ROW B: with CANT tap ===================== -->
  <text x="40" y="344" font-size="14" font-weight="700" fill="#222">B. With the Vetus CANT T-piece inserted - nothing cut, fully reversible</text>

  <line x1="150" y1="394" x2="1030" y2="394" stroke="#333" stroke-width="2.5"/>
  <line x1="150" y1="406" x2="1030" y2="406" stroke="#777" stroke-width="2"/>

  <rect x="150" y="432" width="150" height="56" rx="6" fill="#fdecea" stroke="#a5372a" stroke-width="2"/>
  <text x="225" y="454" text-anchor="middle" font-size="11" font-weight="700" fill="#7a2418">PORT box [term]</text>
  <text x="225" y="471" text-anchor="middle" font-size="9.5" fill="#7a3020">END, untouched</text>
  <line x1="225" y1="406" x2="225" y2="432" stroke="#888" stroke-width="1.5"/>

  <rect x="340" y="432" width="140" height="56" rx="6" fill="#eef4fb" stroke="#1565c0"/>
  <text x="410" y="457" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d47a1">Control (fly)</text>
  <text x="410" y="473" text-anchor="middle" font-size="9" fill="#345">term OFF</text>
  <line x1="410" y1="406" x2="410" y2="432" stroke="#888" stroke-width="1.5"/>

  <!-- CANT inserted in control-control segment -->
  <rect x="560" y="378" width="60" height="34" rx="4" fill="#eafaef" stroke="#1b8a3a" stroke-width="2"/>
  <text x="590" y="399" text-anchor="middle" font-size="9.5" font-weight="700" fill="#155">CANT</text>
  <line x1="590" y1="412" x2="590" y2="452" stroke="#1b8a3a" stroke-width="2.5"/>
  <text x="600" y="432" font-size="9" fill="#1b8a3a">box male M12</text>
  <text x="600" y="444" font-size="9" fill="#1b8a3a">→ CANT spare</text>
  <text x="600" y="456" font-size="9" fill="#1b8a3a">female (no cable)</text>

  <rect x="660" y="432" width="140" height="56" rx="6" fill="#eef4fb" stroke="#1565c0"/>
  <text x="730" y="457" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d47a1">Control (helm)</text>
  <text x="730" y="473" text-anchor="middle" font-size="9" fill="#345">term OFF</text>
  <line x1="730" y1="406" x2="730" y2="432" stroke="#888" stroke-width="1.5"/>

  <rect x="880" y="432" width="150" height="56" rx="6" fill="#fdecea" stroke="#a5372a" stroke-width="2"/>
  <text x="955" y="454" text-anchor="middle" font-size="11" font-weight="700" fill="#7a2418">STBD box [term]</text>
  <text x="955" y="471" text-anchor="middle" font-size="9.5" fill="#7a3020">END, untouched</text>
  <line x1="955" y1="406" x2="955" y2="432" stroke="#888" stroke-width="1.5"/>

  <!-- our box -->
  <rect x="490" y="500" width="200" height="62" rx="6" fill="#eafaef" stroke="#1b8a3a" stroke-width="2"/>
  <text x="590" y="524" text-anchor="middle" font-size="11.5" font-weight="700" fill="#155">Sniffer box</text>
  <text x="590" y="541" text-anchor="middle" font-size="9.5" fill="#245">SK Pang ISO1050 + ESP32 DevKitC</text>
  <text x="590" y="555" text-anchor="middle" font-size="9.5" fill="#245">taps CAN_H/CAN_L only · listen-only · no term · no address</text>
  <line x1="590" y1="452" x2="590" y2="500" stroke="#1b8a3a" stroke-width="2.5"/>

  <!-- key box -->
  <rect x="740" y="500" width="430" height="150" rx="8" fill="#fbfbfc" stroke="#889"/>
  <text x="756" y="524" font-size="12" font-weight="700" fill="#223">The tap, in order</text>
  <text x="756" y="546" font-size="10.5" fill="#334">1. Unplug one interior DTCAN cable. Insert Vetus CANT (2F+1M). Replug.</text>
  <text x="756" y="564" font-size="10.5" fill="#334">2. Box's male M12 plugs into the CANT spare female. No drop cable.</text>
  <text x="756" y="582" font-size="10.5" fill="#334">3. Meter: find CAN_H / CAN_L pins (120Ω across, power off).</text>
  <text x="756" y="600" font-size="10.5" fill="#334">4. Wire only H + L to the SK Pang board. Leave bus 12V alone.</text>
  <text x="756" y="618" font-size="10.5" fill="#334">5. Change NO DIP switch, NO JP19, NO address. We are passive.</text>
  <text x="756" y="638" font-size="10" font-weight="700" fill="#155">Revert = remove CANT, reconnect original cable. Zero trace.</text>

  <text x="40" y="676" font-size="10.5" fill="#889">Specific to the test boat. Boxes are the terminators (differs from the Vetus manual's 2-station example where the stations were the ends). Bit rate unknown - autobaud / scope first.</text>
</svg>
