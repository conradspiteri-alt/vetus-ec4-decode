<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="900" fill="#ffffff"/>
  <text x="600" y="30" text-anchor="middle" font-size="21" font-weight="700" fill="#111">EC4 sniffer - full circuit (Stage 1, listen-only)</text>
  <text x="600" y="51" text-anchor="middle" font-size="12.5" fill="#555">Power, logic, isolation and bus connector. SD is on the ESP32 SPI bus (logic side), not on the isolator.</text>

  <!-- domain labels -->
  <text x="330" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#2e7d32">LOGIC DOMAIN (floating - powered by bank)</text>
  <text x="980" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#5a3d94">BUS DOMAIN (EC4-referenced)</text>

  <!-- isolation barrier -->
  <line x1="760" y1="95" x2="760" y2="700" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="760" y="716" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">GALVANIC ISOLATION (ISO1050, 2500V)</text>

  <!-- ===== POWER ===== -->
  <rect x="40" y="110" width="150" height="90" rx="7" fill="#eef4fb" stroke="#1565c0" stroke-width="2"/>
  <text x="115" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#0d47a1">USB power bank</text>
  <text x="115" y="160" text-anchor="middle" font-size="10.5" fill="#345">5V out</text>
  <text x="115" y="178" text-anchor="middle" font-size="9.5" fill="#345">(floating source)</text>

  <line x1="190" y1="155" x2="250" y2="155" stroke="#1565c0" stroke-width="3"/>
  <text x="220" y="147" text-anchor="middle" font-size="9.5" fill="#1565c0">USB-C</text>

  <!-- future 12V (dashed) -->
  <rect x="40" y="230" width="150" height="86" rx="7" fill="#fff7e6" stroke="#a9791c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="115" y="256" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7a5a12">FUTURE: boat 12V</text>
  <text x="115" y="274" text-anchor="middle" font-size="9" fill="#7a5a12">fuse + TVS + revpol</text>
  <text x="115" y="290" text-anchor="middle" font-size="9" fill="#7a5a12">→ ISOLATED 12→5V DC-DC</text>
  <text x="115" y="306" text-anchor="middle" font-size="9" fill="#7a5a12">(keeps logic floating)</text>
  <path d="M190 273 C 220 273, 225 200, 250 175" fill="none" stroke="#a9791c" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- ===== DEVKIT ===== -->
  <rect x="250" y="110" width="230" height="470" rx="8" fill="#eaf5ec" stroke="#2e7d32" stroke-width="2"/>
  <text x="365" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#1b5e20">ESP32-S3-DevKitC-1</text>
  <text x="365" y="154" text-anchor="middle" font-size="10" fill="#256">USB 5V → onboard 3V3 regulator</text>
  <rect x="272" y="166" width="186" height="30" rx="4" fill="#cfe3cf" stroke="#2e7d32"/>
  <text x="365" y="186" text-anchor="middle" font-size="11" font-weight="700" fill="#153">TWAI = LISTEN-ONLY</text>

  <!-- rails -->
  <text x="266" y="226" font-size="10.5" font-weight="700" fill="#1565c0">3V3 ●</text>
  <text x="266" y="250" font-size="10.5" font-weight="700" fill="#333">GND ●</text>

  <!-- CAN pins -->
  <text x="474" y="300" text-anchor="end" font-size="10.5" font-weight="700" fill="#6a4caf">GPIO5 (TWAI TX) ●</text>
  <text x="474" y="326" text-anchor="end" font-size="10.5" font-weight="700" fill="#6a4caf">GPIO4 (TWAI RX) ●</text>

  <!-- SPI pins -->
  <text x="474" y="386" text-anchor="end" font-size="10.5" font-weight="700" fill="#a9791c">GPIO12 SCK ●</text>
  <text x="474" y="410" text-anchor="end" font-size="10.5" font-weight="700" fill="#a9791c">GPIO11 MOSI ●</text>
  <text x="474" y="434" text-anchor="end" font-size="10.5" font-weight="700" fill="#a9791c">GPIO13 MISO ●</text>
  <text x="474" y="458" text-anchor="end" font-size="10.5" font-weight="700" fill="#a9791c">GPIO10 CS ●</text>

  <!-- USB data -->
  <rect x="272" y="500" width="186" height="56" rx="5" fill="#cfe3cf" stroke="#2e7d32"/>
  <text x="365" y="522" text-anchor="middle" font-size="11" font-weight="700" fill="#1b5e20">USB (native)</text>
  <text x="365" y="540" text-anchor="middle" font-size="9" fill="#256">SavvyCAN live · power in</text>

  <!-- ===== SD BREAKOUT ===== -->
  <rect x="560" y="330" width="160" height="180" rx="8" fill="#fff6e6" stroke="#a9791c" stroke-width="2"/>
  <text x="640" y="356" text-anchor="middle" font-size="12" font-weight="700" fill="#7a5a12">microSD breakout</text>
  <text x="640" y="373" text-anchor="middle" font-size="9.5" fill="#7a5a12">3.3V native · SPI</text>
  <g font-size="10.5" font-weight="700" fill="#7a5a12">
    <text x="576" y="400">VCC</text>
    <text x="576" y="422">GND</text>
    <text x="576" y="444">CLK</text>
    <text x="576" y="466">DI</text>
    <text x="576" y="488">DO</text>
    <text x="700" y="400" text-anchor="end">CS</text>
  </g>
  <text x="640" y="506" text-anchor="middle" font-size="8.5" fill="#a9791c">opt 10k MISO+CS→3V3</text>

  <!-- SPI wires devkit->sd -->
  <line x1="480" y1="386" x2="576" y2="440" stroke="#a9791c" stroke-width="2"/>
  <line x1="480" y1="410" x2="576" y2="460" stroke="#a9791c" stroke-width="2"/>
  <line x1="480" y1="434" x2="576" y2="482" stroke="#a9791c" stroke-width="2"/>
  <line x1="480" y1="458" x2="694" y2="396" stroke="#a9791c" stroke-width="2"/>
  <!-- power to sd -->
  <line x1="300" y1="222" x2="576" y2="394" stroke="#1565c0" stroke-width="1.6"/>
  <line x1="300" y1="246" x2="576" y2="416" stroke="#333" stroke-width="1.6"/>

  <!-- ===== SK PANG (straddles barrier) ===== -->
  <rect x="640" y="120" width="240" height="180" rx="8" fill="#f3eefb" stroke="#5a3d94" stroke-width="2"/>
  <text x="700" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="#3d2a66">SK Pang</text>
  <text x="700" y="162" text-anchor="middle" font-size="9.5" fill="#4a3577">ISO1050</text>
  <text x="700" y="178" text-anchor="middle" font-size="9" fill="#4a3577">+ iso DC-DC</text>
  <!-- host pins -->
  <g font-size="10" font-weight="700" fill="#3d2a66">
    <text x="656" y="210">VCC1</text>
    <text x="656" y="230">GND1</text>
    <text x="656" y="250">TXD</text>
    <text x="656" y="270">RXD</text>
  </g>
  <!-- bus pins -->
  <g font-size="10" font-weight="700" fill="#3d2a66" text-anchor="end">
    <text x="866" y="210">CANH</text>
    <text x="866" y="230">CANL</text>
    <text x="866" y="250">GND2</text>
  </g>

  <!-- devkit->skpang wires -->
  <line x1="300" y1="222" x2="640" y2="206" stroke="#1565c0" stroke-width="1.6"/>
  <line x1="300" y1="246" x2="640" y2="226" stroke="#333" stroke-width="1.6"/>
  <line x1="480" y1="300" x2="640" y2="248" stroke="#6a4caf" stroke-width="2.2"/>
  <line x1="480" y1="326" x2="640" y2="268" stroke="#6a4caf" stroke-width="2.2"/>
  <text x="560" y="300" text-anchor="middle" font-size="8.5" fill="#6a4caf">TX→TXD</text>
  <text x="560" y="322" text-anchor="middle" font-size="8.5" fill="#6a4caf">RXD→RX</text>

  <!-- ===== M12 ===== -->
  <rect x="900" y="150" width="150" height="200" rx="8" fill="#eafaef" stroke="#1b8a3a" stroke-width="2"/>
  <text x="975" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#155">M12 5-pin (male)</text>
  <text x="975" y="192" text-anchor="middle" font-size="9" fill="#245">RS 877-1154, pre-wired</text>
  <g font-size="10" fill="#155">
    <text x="916" y="222" font-weight="700">CAN_H →</text>
    <text x="916" y="246" font-weight="700">CAN_L →</text>
    <text x="916" y="270" font-weight="700">drain →</text>
    <text x="916" y="298" fill="#c0392b" font-weight="700">V+ (12V) ✗ n/c</text>
    <text x="916" y="320" fill="#c0392b" font-weight="700">V- ✗ n/c</text>
  </g>
  <text x="975" y="342" text-anchor="middle" font-size="8" fill="#245">pin numbers: meter first</text>

  <!-- skpang bus -> M12 -->
  <line x1="880" y1="206" x2="900" y2="218" stroke="#1b8a3a" stroke-width="2.5"/>
  <line x1="880" y1="226" x2="900" y2="242" stroke="#1b8a3a" stroke-width="2.5"/>
  <line x1="880" y1="246" x2="900" y2="266" stroke="#888" stroke-width="1.6" stroke-dasharray="3 3"/>

  <!-- M12 -> CANT -> bus -->
  <line x1="975" y1="350" x2="975" y2="400" stroke="#1b8a3a" stroke-width="2.5"/>
  <rect x="915" y="400" width="120" height="46" rx="5" fill="#eafaef" stroke="#1b8a3a"/>
  <text x="975" y="420" text-anchor="middle" font-size="10.5" font-weight="700" fill="#155">Vetus CANT</text>
  <text x="975" y="436" text-anchor="middle" font-size="8.5" fill="#245">spare female port</text>
  <line x1="975" y1="446" x2="975" y2="486" stroke="#333" stroke-width="2.5"/>
  <rect x="890" y="486" width="170" height="60" rx="6" fill="#fdecea" stroke="#a5372a" stroke-width="2"/>
  <text x="975" y="510" text-anchor="middle" font-size="11" font-weight="700" fill="#7a2418">EC4 daisy chain</text>
  <text x="975" y="528" text-anchor="middle" font-size="9" fill="#7a3020">boxes = terminators (ends)</text>
  <text x="975" y="540" text-anchor="middle" font-size="9" fill="#7a3020">controls between · we tap mid-chain</text>

  <!-- ===== NET LEGEND ===== -->
  <rect x="40" y="620" width="700" height="70" rx="7" fill="#fbfbfc" stroke="#889"/>
  <text x="56" y="642" font-size="11.5" font-weight="700" fill="#223">Nets</text>
  <text x="56" y="662" font-size="10.5" fill="#1565c0">■ 3V3</text>
  <text x="130" y="662" font-size="10.5" fill="#333">■ GND</text>
  <text x="210" y="662" font-size="10.5" fill="#6a4caf">■ CAN TWAI (TX/RX, logic)</text>
  <text x="410" y="662" font-size="10.5" fill="#a9791c">■ SPI (SD)</text>
  <text x="520" y="662" font-size="10.5" fill="#1b8a3a">■ CAN bus (H/L, isolated)</text>
  <text x="56" y="682" font-size="10" fill="#c0392b">✗ bus 12V never wired to our node - powered by the bank/DC-DC on the logic side only.</text>

  <!-- ===== BOM callout ===== -->
  <rect x="760" y="620" width="400" height="180" rx="7" fill="#fbfbfc" stroke="#889"/>
  <text x="776" y="644" font-size="11.5" font-weight="700" fill="#223">Attachments / parts on this diagram</text>
  <text x="776" y="666" font-size="10" fill="#334">• USB power bank (5V, floating) - have</text>
  <text x="776" y="684" font-size="10" fill="#334">• ESP32-S3-DevKitC-1 - ordered</text>
  <text x="776" y="702" font-size="10" fill="#334">• SK Pang isolated CAN (ISO1050) - ordered</text>
  <text x="776" y="720" font-size="10" fill="#334">• RS 877-1154 M12 male pre-wired - ordered</text>
  <text x="776" y="738" font-size="10" fill="#334">• microSD breakout 3.3V + card - bought / to buy</text>
  <text x="776" y="756" font-size="10" fill="#334">• Vetus CANT T-piece - to buy</text>
  <text x="776" y="776" font-size="9.5" fill="#889">Future write rig adds isolated 12V DC-DC, supervisor MCU, dead-man - separate build.</text>
  <text x="776" y="792" font-size="9.5" fill="#889">Bit rate unknown - autobaud / scope first.</text>
</svg>
