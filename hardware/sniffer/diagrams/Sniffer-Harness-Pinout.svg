<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1180" height="640" fill="#ffffff"/>
  <text x="590" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#111">EC4 sniffer - harness pinout (Stage 1)</text>
  <text x="590" y="53" text-anchor="middle" font-size="12.5" fill="#555">Two separate ESP32 peripherals: CAN (TWAI) to the SK Pang board, SPI to the SD breakout. GPIOs fixed so firmware matches wiring.</text>

  <!-- ===== SK PANG (CAN) LEFT ===== -->
  <rect x="40" y="120" width="250" height="250" rx="8" fill="#f3eefb" stroke="#5a3d94" stroke-width="2"/>
  <text x="165" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#3d2a66">SK Pang isolated CAN</text>
  <text x="165" y="164" text-anchor="middle" font-size="10.5" fill="#4a3577">ISO1050 · host side pads</text>
  <g font-size="11.5" font-weight="700" fill="#3d2a66">
    <text x="270" y="200" text-anchor="end">VCC1</text>
    <text x="270" y="230" text-anchor="end">GND1</text>
    <text x="270" y="260" text-anchor="end">TXD</text>
    <text x="270" y="290" text-anchor="end">RXD</text>
  </g>
  <text x="165" y="330" text-anchor="middle" font-size="10" fill="#4a3577">bus side → M12 tails</text>
  <text x="165" y="346" text-anchor="middle" font-size="10" fill="#4a3577">(CAN_H, CAN_L) · isolated</text>

  <!-- ===== DEVKIT MIDDLE ===== -->
  <rect x="450" y="90" width="280" height="440" rx="8" fill="#eaf5ec" stroke="#2e7d32" stroke-width="2"/>
  <text x="590" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#1b5e20">ESP32-S3-DevKitC-1</text>
  <text x="590" y="137" text-anchor="middle" font-size="10.5" fill="#256">TWAI (CAN) + SPI (SD), listen-only</text>

  <!-- left pins (CAN) -->
  <g font-size="11.5" font-weight="700" fill="#1b5e20">
    <text x="466" y="200">3V3</text>
    <text x="466" y="230">GND</text>
    <text x="466" y="260">GPIO5</text>
    <text x="466" y="290">GPIO4</text>
  </g>
  <text x="466" y="182" font-size="9.5" fill="#256">- CAN side -</text>
  <text x="520" y="260" font-size="8.5" fill="#256">TWAI TX</text>
  <text x="520" y="290" font-size="8.5" fill="#256">TWAI RX</text>

  <!-- right pins (SD) -->
  <g font-size="11.5" font-weight="700" fill="#1b5e20" text-anchor="end">
    <text x="714" y="200">3V3</text>
    <text x="714" y="230">GND</text>
    <text x="714" y="260">GPIO12</text>
    <text x="714" y="290">GPIO11</text>
    <text x="714" y="320">GPIO13</text>
    <text x="714" y="350">GPIO10</text>
  </g>
  <text x="714" y="182" font-size="9.5" fill="#256" text-anchor="end">- SD side (SPI) -</text>
  <text x="660" y="260" font-size="8.5" fill="#256" text-anchor="end">SCK</text>
  <text x="660" y="290" font-size="8.5" fill="#256" text-anchor="end">MOSI</text>
  <text x="660" y="320" font-size="8.5" fill="#256" text-anchor="end">MISO</text>
  <text x="660" y="350" font-size="8.5" fill="#256" text-anchor="end">CS</text>

  <!-- USB -->
  <rect x="530" y="470" width="120" height="40" rx="5" fill="#cfe3cf" stroke="#2e7d32"/>
  <text x="590" y="490" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1b5e20">USB (native)</text>
  <text x="590" y="504" text-anchor="middle" font-size="9" fill="#256">SavvyCAN live + power bank</text>

  <!-- ===== SD BREAKOUT RIGHT ===== -->
  <rect x="890" y="150" width="250" height="230" rx="8" fill="#fff6e6" stroke="#a9791c" stroke-width="2"/>
  <text x="1015" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5a12">microSD breakout</text>
  <text x="1015" y="194" text-anchor="middle" font-size="10.5" fill="#7a5a12">3.3V native · SPI</text>
  <g font-size="11.5" font-weight="700" fill="#7a5a12">
    <text x="910" y="230">VCC</text>
    <text x="910" y="260">GND</text>
    <text x="910" y="290">CLK</text>
    <text x="910" y="320">DI</text>
    <text x="910" y="350">DO</text>
    <text x="910" y="378" fill="#7a5a12">CS</text>
  </g>

  <!-- ===== WIRES CAN (left) ===== -->
  <line x1="290" y1="196" x2="450" y2="196" stroke="#1565c0" stroke-width="2.5"/>
  <text x="370" y="190" text-anchor="middle" font-size="9" fill="#1565c0">3V3</text>
  <line x1="290" y1="226" x2="450" y2="226" stroke="#333" stroke-width="2.5"/>
  <text x="370" y="220" text-anchor="middle" font-size="9" fill="#333">GND</text>
  <line x1="290" y1="256" x2="450" y2="256" stroke="#6a4caf" stroke-width="2.5"/>
  <text x="370" y="250" text-anchor="middle" font-size="9" fill="#6a4caf">TX→TXD</text>
  <line x1="290" y1="286" x2="450" y2="286" stroke="#6a4caf" stroke-width="2.5"/>
  <text x="370" y="280" text-anchor="middle" font-size="9" fill="#6a4caf">RXD→RX</text>

  <!-- ===== WIRES SD (right) ===== -->
  <line x1="730" y1="196" x2="890" y2="226" stroke="#1565c0" stroke-width="2.5"/>
  <line x1="730" y1="226" x2="890" y2="256" stroke="#333" stroke-width="2.5"/>
  <line x1="730" y1="256" x2="890" y2="286" stroke="#a9791c" stroke-width="2.5"/>
  <line x1="730" y1="286" x2="890" y2="320" stroke="#a9791c" stroke-width="2.5"/>
  <line x1="730" y1="320" x2="890" y2="350" stroke="#a9791c" stroke-width="2.5"/>
  <line x1="730" y1="350" x2="890" y2="378" stroke="#a9791c" stroke-width="2.5"/>
  <text x="812" y="205" text-anchor="middle" font-size="9" fill="#1565c0">3V3</text>
  <text x="812" y="360" text-anchor="middle" font-size="9" fill="#a9791c">SPI ×4</text>

  <!-- ===== NOTES ===== -->
  <rect x="40" y="410" width="380" height="120" rx="8" fill="#fbfbfc" stroke="#889"/>
  <text x="56" y="434" font-size="12" font-weight="700" fill="#223">Notes</text>
  <text x="56" y="456" font-size="10.5" fill="#334">• CAN and SD are different peripherals on different pins.</text>
  <text x="56" y="474" font-size="10.5" fill="#334">• 3V3 rail powers both boards' logic; bus side self-powered</text>
  <text x="56" y="490" font-size="10.5" fill="#334">   by the SK Pang DC-DC across the barrier.</text>
  <text x="56" y="508" font-size="10.5" fill="#334">• Listen-only set in firmware; TXD may be left n/c as a</text>
  <text x="56" y="524" font-size="10.5" fill="#334">   hardware guarantee. If SD init flaky: 10k on MISO+CS to 3V3.</text>

  <text x="590" y="600" text-anchor="middle" font-size="10" fill="#889">GPIO map is firmware-configurable; these values are what the sketch will use. GPIO10-13 avoid strapping/flash pins.</text>
</svg>
