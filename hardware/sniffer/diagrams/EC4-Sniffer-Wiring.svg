<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1180" height="760" fill="#ffffff"/>
  <text x="590" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111">EC4 CAN Sniffer - Stage 1, listen-only</text>
  <text x="590" y="56" text-anchor="middle" font-size="13" fill="#555">Read lever/gear demand. No transmit. Galvanically isolated from the boat control bus.</text>

  <!-- ================= LAPTOP ================= -->
  <rect x="30" y="150" width="150" height="120" rx="8" fill="#eef2f7" stroke="#334" stroke-width="2"/>
  <text x="105" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#111">Laptop / Pi</text>
  <text x="105" y="220" text-anchor="middle" font-size="12" fill="#445">SavvyCAN</text>
  <text x="105" y="238" text-anchor="middle" font-size="12" fill="#445">(SLCAN / SocketCAN)</text>

  <!-- USB-C link -->
  <line x1="180" y1="210" x2="250" y2="210" stroke="#1565c0" stroke-width="3"/>
  <text x="215" y="200" text-anchor="middle" font-size="11" fill="#1565c0">USB-C</text>
  <text x="215" y="234" text-anchor="middle" font-size="10" fill="#1565c0">5V + data</text>

  <!-- Power bank alternative -->
  <rect x="30" y="330" width="150" height="86" rx="8" fill="#fff7e6" stroke="#a9791c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="105" y="360" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a5a12">Standalone option</text>
  <text x="105" y="380" text-anchor="middle" font-size="11" fill="#7a5a12">USB power bank</text>
  <text x="105" y="396" text-anchor="middle" font-size="11" fill="#7a5a12">→ log to SD, no laptop</text>
  <path d="M180 373 C 215 373, 220 300, 250 240" fill="none" stroke="#a9791c" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- ================= ESP32 ================= -->
  <rect x="250" y="140" width="200" height="200" rx="8" fill="#e8f0e8" stroke="#2e5e2e" stroke-width="2"/>
  <text x="350" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#173">ESP32-S3 DevKitC</text>
  <text x="350" y="188" text-anchor="middle" font-size="11.5" fill="#274">TWAI controller</text>
  <rect x="272" y="200" width="156" height="34" rx="5" fill="#cfe3cf" stroke="#2e5e2e"/>
  <text x="350" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#153">MODE = LISTEN-ONLY</text>
  <!-- pins -->
  <text x="440" y="258" text-anchor="end" font-size="11" fill="#222">3V3</text>
  <text x="440" y="280" text-anchor="end" font-size="11" fill="#222">GND</text>
  <text x="440" y="302" text-anchor="end" font-size="11" fill="#222">GPIO (CTX)</text>
  <text x="440" y="324" text-anchor="end" font-size="11" fill="#222">GPIO (CRX)</text>

  <!-- ESP32 -> SK Pang host side wires -->
  <line x1="450" y1="254" x2="560" y2="254" stroke="#1565c0" stroke-width="2.5"/>
  <text x="505" y="248" text-anchor="middle" font-size="10" fill="#1565c0">3.3V</text>
  <line x1="450" y1="276" x2="560" y2="276" stroke="#333" stroke-width="2.5"/>
  <text x="505" y="270" text-anchor="middle" font-size="10" fill="#333">GND</text>
  <line x1="450" y1="298" x2="560" y2="298" stroke="#888" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="505" y="292" text-anchor="middle" font-size="10" fill="#777">CTX (opt.)</text>
  <line x1="450" y1="320" x2="560" y2="320" stroke="#6a4caf" stroke-width="2.5"/>
  <text x="505" y="314" text-anchor="middle" font-size="10" fill="#6a4caf">CRX</text>

  <!-- ================= SK PANG BOARD ================= -->
  <rect x="560" y="140" width="320" height="240" rx="8" fill="#f3eefb" stroke="#5a3d94" stroke-width="2"/>
  <text x="720" y="166" text-anchor="middle" font-size="15" font-weight="700" fill="#3d2a66">SK Pang Isolated CAN Board</text>
  <text x="720" y="185" text-anchor="middle" font-size="11.5" fill="#4a3577">TI ISO1050 + integrated isolated DC-DC</text>

  <!-- isolation barrier -->
  <line x1="720" y1="196" x2="720" y2="366" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="720" y="356" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c0392b">ISOLATION</text>
  <text x="720" y="212" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c0392b">2500V barrier</text>

  <text x="642" y="238" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3d2a66">HOST SIDE</text>
  <text x="642" y="254" text-anchor="middle" font-size="10.5" fill="#5a3d94">(laptop-referenced)</text>
  <text x="800" y="238" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3d2a66">BUS SIDE</text>
  <text x="800" y="254" text-anchor="middle" font-size="10.5" fill="#5a3d94">(floats to bus)</text>

  <!-- bus side out pins -->
  <text x="872" y="292" text-anchor="end" font-size="11" fill="#222">CAN_H</text>
  <text x="872" y="322" text-anchor="end" font-size="11" fill="#222">CAN_L</text>
  <text x="872" y="352" text-anchor="end" font-size="11" fill="#222">iso GND</text>

  <!-- SK Pang -> bus, green safe taps -->
  <line x1="880" y1="288" x2="1010" y2="288" stroke="#1b8a3a" stroke-width="3"/>
  <line x1="880" y1="318" x2="1010" y2="318" stroke="#1b8a3a" stroke-width="3"/>
  <circle cx="1010" cy="288" r="4.5" fill="#1b8a3a"/>
  <circle cx="1010" cy="318" r="4.5" fill="#1b8a3a"/>
  <text x="945" y="281" text-anchor="middle" font-size="10" fill="#1b8a3a">tap CAN_H</text>
  <text x="945" y="336" text-anchor="middle" font-size="10" fill="#1b8a3a">tap CAN_L</text>
  <!-- iso GND left unconnected -->
  <line x1="880" y1="348" x2="930" y2="348" stroke="#999" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="905" y="366" text-anchor="middle" font-size="9.5" fill="#999">n/c</text>

  <!-- ================= EC4 BUS ================= -->
  <rect x="1010" y="120" width="140" height="470" rx="8" fill="#fdecea" stroke="#a5372a" stroke-width="2"/>
  <text x="1080" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#7a2418">EC4 / Flexball</text>
  <text x="1080" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#7a2418">CAN bus</text>

  <!-- bus vertical rails -->
  <line x1="1040" y1="200" x2="1040" y2="560" stroke="#333" stroke-width="2.5"/>
  <line x1="1060" y1="200" x2="1060" y2="560" stroke="#333" stroke-width="2.5"/>
  <text x="1030" y="196" text-anchor="middle" font-size="9.5" fill="#333">H</text>
  <text x="1068" y="196" text-anchor="middle" font-size="9.5" fill="#333">L</text>

  <!-- taps land on bus -->
  <line x1="1010" y1="288" x2="1040" y2="288" stroke="#1b8a3a" stroke-width="3"/>
  <line x1="1010" y1="318" x2="1060" y2="318" stroke="#1b8a3a" stroke-width="3"/>

  <!-- 12V bus power, DO NOT TAP -->
  <line x1="1082" y1="200" x2="1082" y2="560" stroke="#c0392b" stroke-width="2.5"/>
  <text x="1100" y="360" font-size="10" font-weight="700" fill="#c0392b" transform="rotate(90 1100 360)">12V bus power - DO NOT TAP</text>

  <!-- station node -->
  <rect x="1018" y="210" width="84" height="52" rx="5" fill="#fff" stroke="#7a2418"/>
  <text x="1060" y="232" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7a2418">Control</text>
  <text x="1060" y="248" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7a2418">station(s)</text>
  <!-- actuator node -->
  <rect x="1018" y="500" width="84" height="52" rx="5" fill="#fff" stroke="#7a2418"/>
  <text x="1060" y="522" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7a2418">EC4UMM1</text>
  <text x="1060" y="538" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7a2418">actuator</text>

  <!-- 120 ohm terminators -->
  <line x1="1040" y1="205" x2="1060" y2="205" stroke="#a5372a" stroke-width="2"/>
  <text x="1050" y="200" text-anchor="middle" font-size="9" fill="#a5372a">120Ω</text>
  <line x1="1040" y1="558" x2="1060" y2="558" stroke="#a5372a" stroke-width="2"/>
  <text x="1050" y="574" text-anchor="middle" font-size="9" fill="#a5372a">120Ω</text>

  <!-- ================= ANNOTATIONS ================= -->
  <rect x="250" y="400" width="360" height="70" rx="6" fill="#f7f7f9" stroke="#556"/>
  <text x="264" y="422" font-size="11.5" font-weight="700" fill="#223">1. Listen-only is enforced in the ESP32, not the board.</text>
  <text x="264" y="440" font-size="11" fill="#334">TWAI holds TX recessive - no bit reaches the bus.</text>
  <text x="264" y="457" font-size="11" fill="#334">Belt-and-braces: leave CTX physically disconnected (dashed).</text>

  <rect x="560" y="400" width="330" height="70" rx="6" fill="#f7f7f9" stroke="#556"/>
  <text x="574" y="422" font-size="11.5" font-weight="700" fill="#223">2. The barrier breaks the DC ground path.</text>
  <text x="574" y="440" font-size="11" fill="#334">Bus side is powered by the on-board DC-DC, floating</text>
  <text x="574" y="457" font-size="11" fill="#334">to the bus. No ground loop onto the control bus.</text>

  <rect x="250" y="500" width="360" height="88" rx="6" fill="#eafaef" stroke="#1b8a3a"/>
  <text x="264" y="522" font-size="11.5" font-weight="700" fill="#155">3. Tap two wires only: CAN_H and CAN_L.</text>
  <text x="264" y="540" font-size="11" fill="#245">Short stub. Do NOT add a 120Ω terminator - the bus</text>
  <text x="264" y="557" font-size="11" fill="#245">already has one at each end. Do NOT tap the 12V rail.</text>
  <text x="264" y="576" font-size="11" fill="#245">Meter the connector first: 120Ω across H–L, power off.</text>

  <rect x="30" y="620" width="1120" height="110" rx="6" fill="#fbfbfc" stroke="#889"/>
  <text x="44" y="644" font-size="12.5" font-weight="700" fill="#223">Power summary</text>
  <text x="44" y="666" font-size="11.5" fill="#334">• Laptop-tethered: the laptop USB-C powers the ESP32; the SK Pang integrated DC-DC powers its own isolated bus side. No separate PSU.</text>
  <text x="44" y="686" font-size="11.5" fill="#334">• Standalone logging: swap the laptop for a USB power bank (~£15–25) into the ESP32; log frames to SD. Still no bus-side supply.</text>
  <text x="44" y="706" font-size="11.5" fill="#334">• You never draw power from the EC4 bus. Its 12V exists to run the Vetus stations; the sniffer only reads the differential pair.</text>
  <text x="44" y="722" font-size="10.5" fill="#889">Stage 1 read rig. Bit rate unknown - autobaud in listen-only. Write rig (supervisor + dead-man + its own supplies) is a separate, later build.</text>
</svg>
