<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="780" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111">EC4 Sniffer - Integrated PCB block diagram (v0.1)</text>
  <text x="600" y="55" text-anchor="middle" font-size="13" fill="#555">Self-contained, soldered, isolated. No sockets. 3D-printed IP-rated housing.</text>

  <!-- ===== POWER DOMAIN ===== -->
  <rect x="24" y="90" width="300" height="300" rx="10" fill="#eef4fb" stroke="#1565c0" stroke-width="2"/>
  <text x="174" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#0d47a1">POWER INPUT (boat-referenced)</text>

  <rect x="44" y="130" width="120" height="46" rx="6" fill="#fff" stroke="#1565c0"/>
  <text x="104" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#0d47a1">Boat 12V</text>
  <text x="104" y="166" text-anchor="middle" font-size="10" fill="#345">fused DC panel</text>

  <rect x="184" y="130" width="120" height="46" rx="6" fill="#fff" stroke="#1565c0"/>
  <text x="244" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#0d47a1">Fuse + TVS</text>
  <text x="244" y="166" text-anchor="middle" font-size="10" fill="#345">+ revpol MOSFET</text>

  <line x1="164" y1="153" x2="184" y2="153" stroke="#1565c0" stroke-width="2"/>

  <rect x="84" y="200" width="180" height="52" rx="6" fill="#dcebfb" stroke="#0d47a1" stroke-width="1.5"/>
  <text x="174" y="221" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0d47a1">Isolated DC-DC 12→5V</text>
  <text x="174" y="238" text-anchor="middle" font-size="10" fill="#345">wide-in 9–36V, regulated</text>
  <line x1="244" y1="176" x2="244" y2="200" stroke="#1565c0" stroke-width="2"/>

  <rect x="60" y="286" width="110" height="44" rx="6" fill="#fff" stroke="#1565c0" stroke-dasharray="4 3"/>
  <text x="115" y="305" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d47a1">USB-C 5V</text>
  <text x="115" y="320" text-anchor="middle" font-size="9.5" fill="#345">(bench / bank)</text>
  <rect x="184" y="286" width="110" height="44" rx="6" fill="#fff" stroke="#1565c0"/>
  <text x="239" y="305" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d47a1">5V rail → LDO</text>
  <text x="239" y="320" text-anchor="middle" font-size="9.5" fill="#345">3.3V to module</text>
  <line x1="174" y1="252" x2="239" y2="286" stroke="#1565c0" stroke-width="2"/>
  <line x1="115" y1="286" x2="180" y2="308" stroke="#1565c0" stroke-width="1.6" stroke-dasharray="4 3"/>

  <text x="174" y="360" text-anchor="middle" font-size="10.5" fill="#0d47a1">Isolated DC-DC floats the logic side</text>
  <text x="174" y="376" text-anchor="middle" font-size="10.5" fill="#0d47a1">relative to boat ground - this is why</text>

  <!-- ===== LOGIC DOMAIN ===== -->
  <rect x="360" y="90" width="330" height="440" rx="10" fill="#eaf5ec" stroke="#2e7d32" stroke-width="2"/>
  <text x="525" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#1b5e20">LOGIC DOMAIN (floating)</text>

  <rect x="392" y="140" width="266" height="96" rx="8" fill="#fff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="525" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#1b5e20">ESP32-S3-WROOM-1</text>
  <text x="525" y="190" text-anchor="middle" font-size="11" fill="#256">soldered - no socket, no headers</text>
  <text x="525" y="210" text-anchor="middle" font-size="11" fill="#256">TWAI listen-only · native USB</text>
  <text x="525" y="228" text-anchor="middle" font-size="10.5" fill="#256">CTX (opt. n/c) · CRX</text>

  <rect x="392" y="256" width="120" height="54" rx="6" fill="#fff" stroke="#2e7d32"/>
  <text x="452" y="278" text-anchor="middle" font-size="11" font-weight="700" fill="#1b5e20">USB-C (native)</text>
  <text x="452" y="296" text-anchor="middle" font-size="9.5" fill="#256">internal, behind lid</text>

  <rect x="538" y="256" width="120" height="54" rx="6" fill="#fff" stroke="#2e7d32"/>
  <text x="598" y="278" text-anchor="middle" font-size="11" font-weight="700" fill="#1b5e20">microSD</text>
  <text x="598" y="296" text-anchor="middle" font-size="9.5" fill="#256">standalone logging</text>

  <rect x="392" y="326" width="266" height="46" rx="6" fill="#fff" stroke="#2e7d32"/>
  <text x="525" y="348" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1b5e20">BOOT + RESET buttons · status LEDs</text>
  <text x="525" y="364" text-anchor="middle" font-size="9.5" fill="#256">program via native USB bootloader</text>

  <text x="525" y="404" text-anchor="middle" font-size="11" fill="#1b5e20">Listen-only is set in firmware.</text>
  <text x="525" y="420" text-anchor="middle" font-size="11" fill="#1b5e20">TX pad left unpopulated / n/c for</text>
  <text x="525" y="436" text-anchor="middle" font-size="11" fill="#1b5e20">a hardware guarantee in Stage 1.</text>

  <rect x="392" y="456" width="266" height="52" rx="6" fill="#eafaef" stroke="#1b8a3a"/>
  <text x="525" y="477" text-anchor="middle" font-size="10.5" font-weight="700" fill="#155">120Ω terminator footprint = DNP</text>
  <text x="525" y="494" text-anchor="middle" font-size="9.5" fill="#245">tap is a stub; bus already terminated</text>

  <!-- logic to transceiver signal -->
  <line x1="658" y1="200" x2="740" y2="200" stroke="#6a4caf" stroke-width="2.5"/>
  <text x="699" y="192" text-anchor="middle" font-size="9.5" fill="#6a4caf">CTX/CRX</text>

  <!-- ===== ISOLATION BARRIER ===== -->
  <line x1="712" y1="90" x2="712" y2="530" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="712" y="548" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">GALVANIC ISOLATION</text>

  <!-- ===== BUS DOMAIN ===== -->
  <rect x="740" y="90" width="250" height="440" rx="10" fill="#f3eefb" stroke="#5a3d94" stroke-width="2"/>
  <text x="865" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#3d2a66">BUS DOMAIN (bus-referenced)</text>

  <rect x="762" y="150" width="206" height="96" rx="8" fill="#fff" stroke="#5a3d94" stroke-width="1.5"/>
  <text x="865" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#3d2a66">ADM3053</text>
  <text x="865" y="198" text-anchor="middle" font-size="10.5" fill="#4a3577">isolated CAN transceiver</text>
  <text x="865" y="216" text-anchor="middle" font-size="10.5" fill="#4a3577">+ integrated iso DC-DC</text>
  <text x="865" y="234" text-anchor="middle" font-size="10" fill="#4a3577">bus side powered across barrier</text>

  <rect x="762" y="286" width="206" height="60" rx="6" fill="#fff" stroke="#5a3d94"/>
  <text x="865" y="310" text-anchor="middle" font-size="11" font-weight="700" fill="#3d2a66">M12 A-coded, 5-pin, IP67</text>
  <text x="865" y="328" text-anchor="middle" font-size="10" fill="#4a3577">wire CAN_H, CAN_L, drain only</text>

  <line x1="865" y1="246" x2="865" y2="286" stroke="#5a3d94" stroke-width="2"/>

  <text x="865" y="380" text-anchor="middle" font-size="10.5" fill="#5a3d94">Bus-side GND references the</text>
  <text x="865" y="396" text-anchor="middle" font-size="10.5" fill="#5a3d94">CAN cable drain / V- only.</text>
  <text x="865" y="412" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c0392b">Bus 12V is NOT wired in.</text>

  <!-- ===== Y CABLE + BUS ===== -->
  <rect x="1010" y="150" width="168" height="380" rx="10" fill="#fdecea" stroke="#a5372a" stroke-width="2"/>
  <text x="1094" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#7a2418">Y-cable + EC4 bus</text>

  <rect x="1028" y="196" width="132" height="70" rx="6" fill="#fff" stroke="#a5372a"/>
  <text x="1094" y="218" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7a2418">M12 T-splitter</text>
  <text x="1094" y="234" text-anchor="middle" font-size="9.5" fill="#7a3020">trunk passes all 5</text>
  <text x="1094" y="248" text-anchor="middle" font-size="9.5" fill="#7a3020">branch → H,L,drain</text>

  <line x1="990" y1="316" x2="1028" y2="231" stroke="#1b8a3a" stroke-width="2.5"/>
  <text x="1010" y="300" text-anchor="middle" font-size="9" fill="#1b8a3a">short drop &lt;1m</text>

  <line x1="1094" y1="266" x2="1094" y2="300" stroke="#7a2418" stroke-width="2"/>
  <rect x="1040" y="300" width="108" height="40" rx="5" fill="#fff" stroke="#7a2418"/>
  <text x="1094" y="324" text-anchor="middle" font-size="10" font-weight="700" fill="#7a2418">EC4 station</text>
  <line x1="1094" y1="340" x2="1094" y2="380" stroke="#333" stroke-width="2.5"/>
  <line x1="1078" y1="340" x2="1078" y2="380" stroke="#333" stroke-width="2.5"/>
  <rect x="1040" y="380" width="108" height="40" rx="5" fill="#fff" stroke="#7a2418"/>
  <text x="1094" y="404" text-anchor="middle" font-size="10" font-weight="700" fill="#7a2418">EC4 actuator</text>
  <text x="1094" y="446" text-anchor="middle" font-size="9" fill="#a5372a">120Ω each end (existing)</text>
  <text x="1094" y="470" text-anchor="middle" font-size="9" font-weight="700" fill="#c0392b">gender/pinout TBD:</text>
  <text x="1094" y="484" text-anchor="middle" font-size="9" font-weight="700" fill="#c0392b">meter on the boat</text>

  <!-- housing note -->
  <rect x="24" y="560" width="1154" height="196" rx="10" fill="#fbfbfc" stroke="#889"/>
  <text x="40" y="586" font-size="13" font-weight="700" fill="#223">Housing &amp; vibration (the point of the exercise)</text>
  <text x="40" y="610" font-size="11.5" fill="#334">• Everything soldered to one carrier PCB - WROOM module, ADM3053, DC-DC, protection, SD, USB. No Dupont, no board-on-board sockets.</text>
  <text x="40" y="630" font-size="11.5" fill="#334">• 3D-printed enclosure in ASA (UV + engine-bay heat). Gasketed lid, heat-set inserts for PCB standoffs, strain-relief on the M12 and power leads.</text>
  <text x="40" y="650" font-size="11.5" fill="#334">• Conformal-coat the populated board against condensation. Target IP65+ once closed.</text>
  <text x="40" y="670" font-size="11.5" fill="#334">• External, sealed: M12 (bus) + 2-pin waterproof (power). Internal, behind the lid: USB-C + microSD, accessed only when programming or pulling logs.</text>
  <text x="40" y="694" font-size="11.5" fill="#334">• Power path preserves isolation ONLY via the isolated input DC-DC (or a floating USB bank). A bare 12V feed to the logic rail would defeat the barrier.</text>
  <text x="40" y="718" font-size="11.5" fill="#334">• Stage 1 = read only. The same board becomes the monitor node if a Stage 2 write rig is ever built; the write node is separate hardware with its own supervisor.</text>
  <text x="40" y="740" font-size="10.5" fill="#889">v0.1 block diagram - pending the four design decisions. Bit rate unknown (autobaud). Y-cable finalised only after the on-boat connector check.</text>
</svg>
