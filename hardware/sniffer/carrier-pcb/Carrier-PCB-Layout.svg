<text x="122" y="740.8000000000001" class="sm">- NO carrier mounting holes. The enclosure ledge supports the board, lid ribs clamp it, and the four lid screws sit in EXTERNAL bosses clear of the carrier.</text>
<text x="122" y="757.8000000000001" class="sm">- Antenna: notch starts Y=63.5 to clear the P1/P44 pads. Copper keep-out both layers over X 0-29, Y 58-63.5 - no plane, no traces.</text>
<text x="122" y="774.8000000000001" class="sm">- SK Pang far end has no mounting hole. A 6 mm bonded standoff under the DB9 end carries the bending load. Spacer height = seated header height.</text>
<text x="122" y="791.8000000000001" class="sm">- Every passive is through-hole for hand assembly. Component BODY clearances checked, not just pads: minimum body gap on the board is 0.75 mm.</text>
<text x="122" y="808.8000000000001" class="sm">- SD card is lid-off access, ejects +X. Nearest 5 V part (F1 body) is 1.54 mm clear of the card sweep.</text>
</svg>