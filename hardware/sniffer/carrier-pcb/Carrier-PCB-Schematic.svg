<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1240" height="820" fill="#ffffff"/>
  <text x="620" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#111">EC4 sniffer - carrier PCB schematic (v0.3)</text>
  <text x="620" y="48" text-anchor="middle" font-size="12" fill="#555">5 V input · DevKitC 2x22 @ 2.54 mm, rows 22.86 mm · SK Pang + microSD on headers with M3 bracing</text>

  <!-- ===== RAILS ===== -->
  <line x1="60" y1="120" x2="1180" y2="120" stroke="#c0392b" stroke-width="2.5"/>
  <text x="66" y="114" font-size="11" font-weight="700" fill="#c0392b">+5V</text>
  <line x1="420" y1="176" x2="1180" y2="176" stroke="#1565c0" stroke-width="2.5"/>
  <text x="426" y="170" font-size="11" font-weight="700" fill="#1565c0">+3V3</text>
  <line x1="60" y1="720" x2="1180" y2="720" stroke="#333" stroke-width="2.5"/>
  <text x="66" y="740" font-size="11" font-weight="700" fill="#333">GND</text>

  <!-- ===== POWER INPUT ===== -->
  <rect x="60" y="250" width="110" height="80" rx="4" fill="#eef4fb" stroke="#1565c0" stroke-width="2"/>
  <text x="115" y="276" text-anchor="middle" font-size="12" font-weight="700" fill="#0d47a1">J2</text>
  <text x="115" y="294" text-anchor="middle" font-size="9.5" fill="#345">2-way screw</text>
  <text x="115" y="308" text-anchor="middle" font-size="9.5" fill="#345">3.5/3.81 pitch</text>
  <text x="115" y="322" text-anchor="middle" font-size="9" fill="#345">+5V / 0V</text>

  <!-- J2 +5V out -->
  <line x1="170" y1="270" x2="215" y2="270" stroke="#333" stroke-width="2"/>
  <!-- F1 -->
  <rect x="215" y="258" width="46" height="24" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="238" y="275" text-anchor="middle" font-size="10" font-weight="700">F1</text>
  <text x="238" y="250" text-anchor="middle" font-size="8.5" fill="#555">1 A PTC</text>
  <line x1="261" y1="270" x2="300" y2="270" stroke="#333" stroke-width="2"/>
  <!-- D2 schottky -->
  <polygon points="300,258 300,282 322,270" fill="#fff" stroke="#333" stroke-width="2"/>
  <line x1="322" y1="256" x2="322" y2="284" stroke="#333" stroke-width="2"/>
  <path d="M322 284 l-6 6 M322 256 l6 -6" stroke="#333" stroke-width="2" fill="none"/>
  <text x="311" y="248" text-anchor="middle" font-size="8.5" fill="#555">D2 1N5819</text>
  <text x="311" y="302" text-anchor="middle" font-size="8" fill="#555">blocks reverse</text>
  <line x1="322" y1="270" x2="400" y2="270" stroke="#333" stroke-width="2"/>
  <line x1="400" y1="270" x2="400" y2="120" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="400" cy="120" r="3.5" fill="#c0392b"/>

  <!-- D1 TVS -->
  <line x1="352" y1="270" x2="352" y2="340" stroke="#333" stroke-width="2"/>
  <circle cx="352" cy="270" r="3.5" fill="#333"/>
  <polygon points="342,340 362,340 352,358" fill="#fff" stroke="#333" stroke-width="2"/>
  <line x1="338" y1="358" x2="366" y2="358" stroke="#333" stroke-width="2"/>
  <path d="M338 358 l-5 6 M366 358 l5 -6" stroke="#333" stroke-width="2" fill="none"/>
  <text x="384" y="352" font-size="8.5" fill="#555">D1 SMBJ6.0A</text>
  <line x1="352" y1="358" x2="352" y2="720" stroke="#333" stroke-width="2"/>
  <circle cx="352" cy="720" r="3.5" fill="#333"/>

  <!-- C1 C2 -->
  <line x1="400" y1="200" x2="400" y2="120" stroke="#c0392b" stroke-width="0"/>
  <g>
    <line x1="252" y1="400" x2="252" y2="430" stroke="#333" stroke-width="2"/>
    <line x1="238" y1="430" x2="266" y2="430" stroke="#333" stroke-width="2.5"/>
    <line x1="238" y1="440" x2="266" y2="440" stroke="#333" stroke-width="2.5"/>
    <line x1="252" y1="440" x2="252" y2="720" stroke="#333" stroke-width="2"/>
    <circle cx="252" cy="720" r="3.5" fill="#333"/>
    <line x1="252" y1="400" x2="400" y2="400" stroke="#333" stroke-width="2"/>
    <circle cx="400" cy="400" r="3.5" fill="#c0392b"/>
    <line x1="400" y1="400" x2="400" y2="270" stroke="#c0392b" stroke-width="2.5"/>
    <text x="276" y="424" font-size="9" fill="#555">C1 100 uF</text>
    <text x="276" y="438" font-size="9" fill="#555">C2 100 nF</text>
  </g>

  <!-- J2 0V -->
  <line x1="170" y1="310" x2="196" y2="310" stroke="#333" stroke-width="2"/>
  <line x1="196" y1="310" x2="196" y2="720" stroke="#333" stroke-width="2"/>
  <circle cx="196" cy="720" r="3.5" fill="#333"/>

  <!-- ===== U1 DevKitC ===== -->
  <rect x="440" y="210" width="230" height="420" rx="6" fill="#eaf5ec" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="555" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#1b5e20">U1  ESP32-S3-DevKitC-1</text>
  <text x="555" y="256" text-anchor="middle" font-size="9.5" fill="#256">2 x 22 header, 2.54 mm, rows 22.86 mm</text>
  <text x="555" y="272" text-anchor="middle" font-size="9" fill="#c0392b">solder ALL pins (mechanical)</text>

  <!-- left pins -->
  <g font-size="10.5" font-weight="700" fill="#1b5e20">
    <text x="452" y="308">5V   [P21]</text>
    <text x="452" y="348">3V3  [P1]</text>
    <text x="452" y="608">GND  [P22]</text>
  </g>
  <line x1="440" y1="304" x2="400" y2="304" stroke="#c0392b" stroke-width="2"/>
  <circle cx="400" cy="304" r="3.5" fill="#c0392b"/>
  <line x1="440" y1="344" x2="420" y2="344" stroke="#1565c0" stroke-width="2"/>
  <line x1="420" y1="344" x2="420" y2="176" stroke="#1565c0" stroke-width="2.5"/>
  <circle cx="420" cy="176" r="3.5" fill="#1565c0"/>
  <line x1="440" y1="604" x2="412" y2="604" stroke="#333" stroke-width="2"/>
  <line x1="412" y1="604" x2="412" y2="720" stroke="#333" stroke-width="2"/>
  <circle cx="412" cy="720" r="3.5" fill="#333"/>

  <!-- right pins -->
  <g font-size="10.5" font-weight="700" fill="#1b5e20" text-anchor="end">
    <text x="658" y="308">[P5]  GPIO5</text>
    <text x="658" y="338">[P4]  GPIO4</text>
    <text x="658" y="424">[P18] GPIO12</text>
    <text x="658" y="454">[P17] GPIO11</text>
    <text x="658" y="484">[P19] GPIO13</text>
    <text x="658" y="514">[P16] GPIO10</text>
  </g>

  <!-- ===== U2 SK PANG ===== -->
  <rect x="860" y="230" width="220" height="180" rx="6" fill="#f3eefb" stroke="#5a3d94" stroke-width="2.5"/>
  <text x="970" y="256" text-anchor="middle" font-size="13" font-weight="700" fill="#3d2a66">U2  SK Pang ISO1050</text>
  <text x="970" y="272" text-anchor="middle" font-size="9" fill="#4a3577">header = electrical + 1 edge</text>
  <text x="970" y="286" text-anchor="middle" font-size="9" fill="#4a3577">M3 holes = far edge bracing</text>
  <g font-size="10.5" font-weight="700" fill="#3d2a66">
    <text x="872" y="318">VCC</text>
    <text x="872" y="344">GND</text>
    <text x="872" y="370">TXD</text>
    <text x="872" y="396">RXD</text>
  </g>
  <text x="970" y="430" text-anchor="middle" font-size="9" fill="#c0392b">bus side: own screw terminal, OFF-BOARD</text>
  <text x="970" y="444" text-anchor="middle" font-size="9" fill="#c0392b">to M12 CAN_H / CAN_L / 0V</text>

  <!-- U1 -> U2 signals -->
  <line x1="670" y1="304" x2="856" y2="366" stroke="#6a4caf" stroke-width="2"/>
  <text x="762" y="330" text-anchor="middle" font-size="8.5" fill="#6a4caf">CAN_TX</text>
  <line x1="670" y1="334" x2="856" y2="392" stroke="#6a4caf" stroke-width="2"/>
  <text x="762" y="374" text-anchor="middle" font-size="8.5" fill="#6a4caf">CAN_RX</text>
  <!-- U2 power -->
  <line x1="856" y1="314" x2="820" y2="314" stroke="#1565c0" stroke-width="2"/>
  <line x1="820" y1="314" x2="820" y2="176" stroke="#1565c0" stroke-width="2.5"/>
  <circle cx="820" cy="176" r="3.5" fill="#1565c0"/>
  <line x1="856" y1="340" x2="800" y2="340" stroke="#333" stroke-width="2"/>
  <line x1="800" y1="340" x2="800" y2="720" stroke="#333" stroke-width="2"/>
  <circle cx="800" cy="720" r="3.5" fill="#333"/>
  <!-- C3 -->
  <line x1="1120" y1="314" x2="1120" y2="360" stroke="#333" stroke-width="2"/>
  <circle cx="1120" cy="314" r="3.5" fill="#333"/>
  <line x1="856" y1="314" x2="1120" y2="314" stroke="#1565c0" stroke-width="0"/>
  <line x1="1106" y1="360" x2="1134" y2="360" stroke="#333" stroke-width="2.5"/>
  <line x1="1106" y1="370" x2="1134" y2="370" stroke="#333" stroke-width="2.5"/>
  <line x1="1120" y1="370" x2="1120" y2="720" stroke="#333" stroke-width="2"/>
  <circle cx="1120" cy="720" r="3.5" fill="#333"/>
  <text x="1142" y="348" font-size="9" fill="#555">C3 100 nF</text>
  <line x1="1120" y1="314" x2="1120" y2="176" stroke="#1565c0" stroke-width="2.5"/>
  <circle cx="1120" cy="176" r="3.5" fill="#1565c0"/>

  <!-- ===== U3 microSD ===== -->
  <rect x="860" y="470" width="220" height="200" rx="6" fill="#fff6e6" stroke="#a9791c" stroke-width="2.5"/>
  <text x="970" y="496" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5a12">U3  microSD breakout</text>
  <text x="970" y="512" text-anchor="middle" font-size="9" fill="#7a5a12">3.3 V native · SPI</text>
  <g font-size="10.5" font-weight="700" fill="#7a5a12">
    <text x="872" y="544">VCC</text>
    <text x="872" y="568">GND</text>
    <text x="872" y="592">CLK</text>
    <text x="872" y="616">DI</text>
    <text x="872" y="640">DO</text>
    <text x="1068" y="544" text-anchor="end">CS</text>
  </g>

  <!-- U1 -> U3 -->
  <line x1="670" y1="420" x2="856" y2="588" stroke="#a9791c" stroke-width="2"/>
  <line x1="670" y1="450" x2="856" y2="612" stroke="#a9791c" stroke-width="2"/>
  <line x1="670" y1="480" x2="856" y2="636" stroke="#a9791c" stroke-width="2"/>
  <line x1="670" y1="510" x2="740" y2="510" stroke="#a9791c" stroke-width="2"/>
  <line x1="740" y1="510" x2="740" y2="686" stroke="#a9791c" stroke-width="2"/>
  <line x1="740" y1="686" x2="1094" y2="686" stroke="#a9791c" stroke-width="2"/>
  <line x1="1094" y1="686" x2="1094" y2="540" stroke="#a9791c" stroke-width="2"/>
  <line x1="1094" y1="540" x2="1072" y2="540" stroke="#a9791c" stroke-width="2"/>
  <text x="762" y="512" text-anchor="middle" font-size="8.5" fill="#a9791c">SD_CS</text>
  <text x="760" y="500" text-anchor="middle" font-size="8.5" fill="#a9791c"> </text>
  <!-- U3 power -->
  <line x1="856" y1="540" x2="820" y2="540" stroke="#1565c0" stroke-width="2"/>
  <line x1="820" y1="540" x2="820" y2="176" stroke="#1565c0" stroke-width="0"/>
  <circle cx="820" cy="540" r="3.5" fill="#1565c0"/>
  <line x1="820" y1="540" x2="820" y2="314" stroke="#1565c0" stroke-width="2.5"/>
  <line x1="856" y1="564" x2="800" y2="564" stroke="#333" stroke-width="2"/>
  <circle cx="800" cy="564" r="3.5" fill="#333"/>

  <!-- R1 R2 pull-ups -->
  <rect x="700" y="596" width="18" height="40" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="690" y="620" text-anchor="end" font-size="8.5" fill="#555">R1 10k DNP</text>
  <line x1="709" y1="596" x2="709" y2="176" stroke="#1565c0" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="709" y1="636" x2="709" y2="636" stroke="#333" stroke-width="1.2"/>
  <text x="690" y="660" text-anchor="end" font-size="8.5" fill="#555">R2 10k DNP  (CS)</text>

  <!-- ===== NOTES ===== -->
  <rect x="60" y="500" width="330" height="190" rx="6" fill="#fbfbfc" stroke="#889"/>
  <text x="76" y="524" font-size="11.5" font-weight="700" fill="#223">Resolved</text>
  <text x="76" y="546" font-size="10" fill="#334">• Row spacing measured ~23 mm -&gt; 22.86 mm (0.9").</text>
  <text x="76" y="562" font-size="10" fill="#334">  25.4 mm would have read ~26. Official KiCad</text>
  <text x="76" y="578" font-size="10" fill="#334">  footprint is correct for this board.</text>
  <text x="76" y="600" font-size="10" fill="#334">• Terminal measured ~3.58 mm. Pads will be OVAL</text>
  <text x="76" y="616" font-size="10" fill="#334">  (2.0 x 1.4 mm) centred 3.655 mm, so BOTH the</text>
  <text x="76" y="632" font-size="10" fill="#334">  3.5 and 3.81 mm standards drop in. No gamble.</text>
  <text x="76" y="656" font-size="10" fill="#334">• 5 V only. For boat 12 V later, use an ISOLATED</text>
  <text x="76" y="672" font-size="10" fill="#334">  12-5 V brick upstream of J2.</text>
</svg>
